<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title description" focusable="false">
  <title id="title">Scholarship Hunter — Opportunity Atlas</title>
  <desc id="description">An abstract, editorial atlas of connected pathways and a bright destination point. Ilustrasi atlas abstrak dengan jalur-jalur yang saling terhubung dan satu titik tujuan yang bercahaya.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102C3D"/>
      <stop offset="1" stop-color="#071A28"/>
    </linearGradient>
    <radialGradient id="horizon" cx="72%" cy="48%" r="62%">
      <stop offset="0" stop-color="#1A5367" stop-opacity=".72"/>
      <stop offset=".58" stop-color="#12384B" stop-opacity=".34"/>
      <stop offset="1" stop-color="#0A2130" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F4D58E" stop-opacity=".42"/>
      <stop offset="1" stop-color="#F4D58E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1" fill="#B8D3D8" opacity=".25"/>
      <circle cx="23" cy="27" r=".8" fill="#B8D3D8" opacity=".17"/>
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="20" fill="url(#ocean)"/>
  <rect width="1200" height="520" rx="20" fill="url(#horizon)"/>
